[build-system]
requires = [
    "scikit-build-core",
    "cython~=3.1.0",
    "numpy>=2.0",
    "raysect==0.9.1.*",
    "cherab==1.6.*",
]
build-backend="scikit_build_core.build"

[project]
name = "cherab-solps"
version = "1.4.0"
dependencies = [
    "raysect == 0.9.1.*",
    "cherab == 1.6.*",
    "numpy>=2.0",
    "matplotlib",
    "scipy",
]
description = "Cherab spectroscopy framework: SOLPS submodule"
readme = "README.md"
license = {file = "LICENCE.txt"}
requires-python = ">= 3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
homepage = "https://github.com/cherab"
documentation = "https://www.cherab.info"
repository = "https://github.com/cherab/solps"
issues = "https://github.com/cherab/solps/issues"

[tool.scikit-build]
cmake.version = ">=3.24"
minimum-version = "0.10"
sdist.exclude = [
    ".github",
    ".gitignore",
    "dev",
    "wheelhouse",
]
wheel.exclude = [
    "**.pyx",
    "CMakeLists.txt",
]
wheel.packages = ["cherab"]
build-dir = "build/{state}"
build.verbose = true  # For development, show the build commands.
